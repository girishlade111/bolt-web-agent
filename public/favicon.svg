<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base shape with rounded corners -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Subtle top shine -->
  <rect width="32" height="16" rx="7" fill="url(#shine)"/>

  <!-- Accent border glow -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="url(#accent)" stroke-opacity="0.35" stroke-width="1"/>

  <!-- Letter mark: stylized "L" -->
  <g filter="url(#glow)">
    <rect x="7" y="8" width="2.8" height="13" rx="1" fill="url(#accent)"/>
    <rect x="7" y="18.2" width="8" height="2.8" rx="1" fill="url(#accent)"/>
  </g>

  <!-- Letter mark: stylized "S" -->
  <g filter="url(#glow)">
    <!-- S top bar -->
    <rect x="16.5" y="8" width="7.5" height="2.5" rx="1" fill="url(#accent)"/>
    <!-- S middle bar -->
    <rect x="16.5" y="14.75" width="7.5" height="2.5" rx="1" fill="url(#accent)"/>
    <!-- S bottom bar -->
    <rect x="16.5" y="21.5" width="7.5" height="2.5" rx="1" fill="url(#accent)"/>
    <!-- S left-top connector -->
    <rect x="16.5" y="8" width="2.5" height="6.75" rx="1" fill="url(#accent)"/>
    <!-- S right-bottom connector -->
    <rect x="21.5" y="14.75" width="2.5" height="9.25" rx="1" fill="url(#accent)"/>
  </g>

  <!-- Bottom highlight dot -->
  <circle cx="29" cy="29" r="1.5" fill="#38bdf8" opacity="0.7"/>
</svg>
