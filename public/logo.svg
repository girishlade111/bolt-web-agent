<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40" width="200" height="40">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8e8f0"/>
      <stop offset="100%" stop-color="#c4c8e8"/>
    </linearGradient>
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Icon mark (28x28 at left) -->
  <g transform="translate(6, 6)">
    <!-- Background pill -->
    <rect width="28" height="28" rx="6" fill="url(#iconBg)"/>
    <rect width="28" height="14" rx="6" fill="url(#shine)"/>
    <!-- Border -->
    <rect x="0.5" y="0.5" width="27" height="27" rx="5.5" fill="none" stroke="url(#accent)" stroke-opacity="0.4" stroke-width="0.8"/>

    <!-- L mark -->
    <g filter="url(#glow)">
      <rect x="5.5" y="6" width="2.4" height="11.5" rx="0.8" fill="url(#accent)"/>
      <rect x="5.5" y="15.2" width="7" height="2.4" rx="0.8" fill="url(#accent)"/>
    </g>

    <!-- S mark -->
    <g filter="url(#glow)">
      <rect x="14" y="6" width="6.5" height="2.2" rx="0.7" fill="url(#accent)"/>
      <rect x="14" y="12.9" width="6.5" height="2.2" rx="0.7" fill="url(#accent)"/>
      <rect x="14" y="19.8" width="6.5" height="2.2" rx="0.7" fill="url(#accent)"/>
      <rect x="14" y="6" width="2.2" height="6.9" rx="0.7" fill="url(#accent)"/>
      <rect x="18.3" y="12.9" width="2.2" height="9.1" rx="0.7" fill="url(#accent)"/>
    </g>
  </g>

  <!-- Brand name -->
  <text
    x="44"
    y="24"
    font-family="'Inter', 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="15"
    font-weight="700"
    letter-spacing="-0.02em"
    fill="url(#textGrad)"
  >LS Build</text>

  <!-- Tagline -->
  <text
    x="44"
    y="33"
    font-family="'Inter', 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="7.5"
    font-weight="500"
    letter-spacing="0.06em"
    fill="url(#tagGrad)"
    opacity="0.9"
  >AI APPLICATION BUILDER</text>

  <!-- Separator line -->
  <line x1="43" y1="27.5" x2="43" y2="35" stroke="url(#accent)" stroke-opacity="0.0"/>

  <!-- Enterprise badge -->
  <g transform="translate(153, 14)">
    <rect width="36" height="12" rx="3" fill="#1a1a2e" stroke="url(#accent)" stroke-opacity="0.5" stroke-width="0.7"/>
    <text
      x="18"
      y="8.8"
      font-family="'Inter', -apple-system, sans-serif"
      font-size="6"
      font-weight="600"
      letter-spacing="0.08em"
      fill="url(#tagGrad)"
      text-anchor="middle"
    >ENTERPRISE</text>
  </g>
</svg>
