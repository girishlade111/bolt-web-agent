<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 32" width="200" height="32">
  <defs>
    <linearGradient id="ltIconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <linearGradient id="ltAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="ltShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="ltGlow">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Icon mark -->
  <g transform="translate(2, 2)">
    <rect width="28" height="28" rx="6" fill="url(#ltIconBg)"/>
    <rect width="28" height="14" rx="6" fill="url(#ltShine)"/>
    <rect x="0.5" y="0.5" width="27" height="27" rx="5.5" fill="none" stroke="url(#ltAccent)" stroke-opacity="0.4" stroke-width="0.8"/>

    <!-- L -->
    <g filter="url(#ltGlow)">
      <rect x="5" y="6" width="2.4" height="11.5" rx="0.8" fill="url(#ltAccent)"/>
      <rect x="5" y="15.2" width="7" height="2.4" rx="0.8" fill="url(#ltAccent)"/>
    </g>

    <!-- S -->
    <g filter="url(#ltGlow)">
      <rect x="14" y="6" width="6.5" height="2.2" rx="0.7" fill="url(#ltAccent)"/>
      <rect x="14" y="12.9" width="6.5" height="2.2" rx="0.7" fill="url(#ltAccent)"/>
      <rect x="14" y="19.8" width="6.5" height="2.2" rx="0.7" fill="url(#ltAccent)"/>
      <rect x="14" y="6" width="2.2" height="6.9" rx="0.7" fill="url(#ltAccent)"/>
      <rect x="18.3" y="12.9" width="2.2" height="9.1" rx="0.7" fill="url(#ltAccent)"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text
    x="38"
    y="20"
    font-family="'Inter', 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="14"
    font-weight="700"
    letter-spacing="-0.02em"
    fill="currentColor"
  >LS Build</text>
</svg>
