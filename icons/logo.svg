<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="iconBgI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <linearGradient id="accentI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="shineI" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowI">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#iconBgI)"/>
  <rect width="32" height="16" rx="7" fill="url(#shineI)"/>
  <!-- Border ring -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="url(#accentI)" stroke-opacity="0.4" stroke-width="0.9"/>

  <!-- L letterform -->
  <g filter="url(#glowI)">
    <rect x="5.5" y="7" width="2.8" height="13.5" rx="1" fill="url(#accentI)"/>
    <rect x="5.5" y="17.7" width="8.5" height="2.8" rx="1" fill="url(#accentI)"/>
  </g>

  <!-- S letterform -->
  <g filter="url(#glowI)">
    <rect x="16.5" y="7" width="8" height="2.6" rx="0.9" fill="url(#accentI)"/>
    <rect x="16.5" y="14.7" width="8" height="2.6" rx="0.9" fill="url(#accentI)"/>
    <rect x="16.5" y="22.4" width="8" height="2.6" rx="0.9" fill="url(#accentI)"/>
    <rect x="16.5" y="7" width="2.6" height="7.7" rx="0.9" fill="url(#accentI)"/>
    <rect x="21.9" y="14.7" width="2.6" height="10.3" rx="0.9" fill="url(#accentI)"/>
  </g>

  <!-- Accent dot -->
  <circle cx="29.5" cy="29.5" r="1.2" fill="#38bdf8" opacity="0.8"/>
</svg>
